name: SkellWorld local hub and dashboard
on:
  push:
    paths:
      - "tools/skellworld_*.py"
      - "SkellWorld/**"
      - ".github/workflows/skellworld.yml"
  pull_request:
    paths:
      - "tools/skellworld_*.py"
      - "SkellWorld/**"
      - ".github/workflows/skellworld.yml"
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q tools/skellworld_hub.py tools/skellworld_dashboard.py SkellWorld/tests
      - name: JavaScript syntax validation
        run: node --check SkellWorld/web/app.js
      - name: Integration and security regression tests
        run: python -m unittest discover -s SkellWorld/tests -v
      - name: Synthetic 1 / 8 / 16 / 32 peer load and protocol validation
        run: python tools/benchmark_skellworld.py --counts 1,8,16,32 --events 8 --output skellworld-benchmark.json
      - name: Upload benchmark observations
        uses: actions/upload-artifact@v7.0.2
        with:
          name: skellworld-load-${{ matrix.os }}-py${{ matrix.python-version }}
          path: skellworld-benchmark.json
          if-no-files-found: error
          retention-days: 14
