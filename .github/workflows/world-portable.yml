name: SkellWorld portable Windows application

on:
  push:
    branches: [main]
    paths:
      - "SkellWorld/**"
      - "tools/skellworld_*.py"
      - "tools/smoke_frozen_world.py"
      - ".github/workflows/world-portable.yml"
  pull_request:
    paths:
      - "SkellWorld/**"
      - "tools/skellworld_*.py"
      - "tools/smoke_frozen_world.py"
      - ".github/workflows/world-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skellworld-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Test local hub and desktop service
        run: python -m unittest discover -s SkellWorld/tests -v
      - name: Install pinned Windows packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - name: Build portable no-console EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SkellWorld --paths tools --add-data "SkellWorld/web;SkellWorld/web" --add-data "SkellWorld/catalog.json;SkellWorld" tools/skellworld_desktop.py
      - name: Smoke test frozen EXE, real TCP events and dashboard
        run: python tools/smoke_frozen_world.py dist/SkellWorld.exe
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          Copy-Item docs/WINDOWS_PORTABLE.md dist/README-PORTABLE.md
          Compress-Archive -Path dist/SkellWorld.exe,dist/README-PORTABLE.md -DestinationPath dist/SkellWorld-Windows-Portable.zip -Force
          if (!(Test-Path dist/SkellWorld-Windows-Portable.zip)) { throw "Portable ZIP not created" }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SkellWorld-Windows-Portable
          path: |
            dist/SkellWorld.exe
            dist/SkellWorld-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
